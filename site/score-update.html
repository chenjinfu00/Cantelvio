  <main><h1>打开最新版 Score</h1><p id="update-status" role="status">正在准备新版 Score…</p><progress id="update-progress" max="1" value="0" aria-label="更新进度"></progress><p>完成后自动进入曲谱库。曲谱、批注和设置会保留。</p><button id="update-retry" hidden>重试</button><br><a href="./library/?library=1">返回曲谱库</a></main>
