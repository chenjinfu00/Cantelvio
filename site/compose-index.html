<h1>Cantelvio Compose</h1>
<p data-zh="Compose 负责音乐生成。网页上只能运行在浏览器里的联合模型（旋律、和声、低音与配器）；给定旋律配伴奏、连续演奏和录音转谱需要本机的 Python 服务和模型权重，不在这个静态站里。" data-en="Compose handles generation. The web site can only run the joint model that fits in the browser (melody, harmony, bass and orchestration); accompaniment for a given melody, continuous performance and audio-to-score need the local Python service and model weights, which are not part of this static site.">Compose 负责音乐生成。</p>

<script>(function(){var s=document.getElementById('lang'),l;try{l=localStorage.getItem('cantelvio-lang')}catch(e){}l=l||((navigator.language||'').indexOf('zh')===0?'zh':'en');
function set(v){document.documentElement.lang=v==='en'?'en':'zh-CN';document.querySelectorAll('[data-zh]').forEach(function(e){e.textContent=e.getAttribute('data-'+v)})}
s.value=l;set(l);s.onchange=function(){set(s.value);try{localStorage.setItem('cantelvio-lang',s.value)}catch(e){}}})();</script></body></html>
