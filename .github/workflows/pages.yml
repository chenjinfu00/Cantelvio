name: Deploy Cantelvio web
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', 'package*.json', 'site/**', 'Score/apps/web/**', 'Score/packages/**', 'Score/*.json', 'Score/.nvmrc', 'Harmony/public/**', 'Stage/docs/**', 'Compose/frontend/**', 'Compose/training/reports/amt-compare-20261005/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: Score/package-lock.json}
      - run: npm ci
        working-directory: Score
      - name: Validate browser modules
        run: npm test
      - name: Validate the score editor
        run: npm run check --prefix Score
      - run: node site/build.mjs --build
      - run: node site/check-links.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: site-dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
