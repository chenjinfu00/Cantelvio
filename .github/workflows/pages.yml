name: Deploy demo site
on:
  push:
    branches: [main]
    paths: ['site/**', 'Score/apps/web/**', 'Score/packages/**', 'Harmony/public/**', 'Stage/docs/**', 'Compose/frontend/**', 'Compose/training/reports/amt-compare-20261005/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: Score/package-lock.json}
      - run: npm ci
        working-directory: Score
      - run: node site/build.mjs --build
      - run: node site/check-links.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site-dist}
      - id: deployment
        uses: actions/deploy-pages@v4
