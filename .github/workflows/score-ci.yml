name: Score CI

on:
  push:
    branches: [main]
    paths: ['Score/**', '.github/workflows/score-ci.yml']
  pull_request:
    paths: ['Score/**', '.github/workflows/score-ci.yml']

concurrency:
  group: score-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Score
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Score/.nvmrc
          cache: npm
          cache-dependency-path: Score/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Render sample scores
        run: npm run render -- --all --out out/renders --svg-only
      - uses: actions/upload-artifact@v4
        with:
          name: sample-renders
          path: Score/out/renders
          retention-days: 14
